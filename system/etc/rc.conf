# Host specific
hostname="t480s"
wlans_iwlwifi0="wlan0"
ifconfig_wlan0="NOAUTO WPA  NOSYNCDHCP"
ifconfig_wlan0_ipv6="NOAUTO inet6 accept_rtadv"
create_args_wlan0="country GB regdomain ETSI"
kld_list="i915kms"
intel_undervolt_enable="YES"
zfs_enable="YES"

# Generic
dumpdev="AUTO"
seatd_enable="YES"
background_dhclient="YES"
dhclient_arpwait="NO"
defaultroute_delay="0"
wpa_supplicant_flags="-q"
allscreens_flags="-r 100 17"
tmux_enable="YES"
clear_tmp_enable="YES"
keymap="us.kbd"
sshd_enable="YES"
ntpd_enable="YES"
ntpd_sync_on_start="YES"
local_unbound_enable="YES"
powerd_enable="YES"
moused_enable="YES"
