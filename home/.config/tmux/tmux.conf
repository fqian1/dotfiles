set -g escape-time 0
set -g status-keys vi
set -g mode-keys vi
set -g focus-events on
set -g default-terminal "screen-256color"

# status line (vim tpipeline)
set -g status-left-length 99
set -g status-right-length 99
set -g status-right "CPU: #(top -b -d 0 1 | awk '/CPU:/ {print $2+$4+$6}')%% | MEM: #(top -b -d 0 1 | awk '/Mem:/ {print $2}') | BAT: #(sysctl -n hw.acpi.battery.life)%% | %H:%M:%S"
set -g status-left ""
set -g window-status-current-style "fg=blue bg=default bold"
set -g window-status-current-format " #S "
set -g status-position top
set -g status-justify absolute-centre
set -g status-style bg=default
set -g status-interval 1

# dim inactive windows
set-option -g window-style        "fg=white,bg=default"
set-option -g window-active-style "fg=default,bg=default"

# invisible borders
set -g pane-border-style          "fg=black,bg=default"
set -g pane-active-border-style   "fg=black,bg=default"

bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

